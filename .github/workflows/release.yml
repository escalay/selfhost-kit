# On main: release-please keeps a release pull request open from the Conventional Commits since the last release.
# Merging it tags vX.Y.Z and drafts the GitHub Release. This workflow then tests the updater end to end, builds its
# image for amd64 and arm64, pushes it to GHCR as X.Y.Z, X.Y, X and latest, and signs it with cosign (keyless, by this
# workflow's identity: a running updater accepts its successor only with that signature). It then publishes the
# example app (example/) the way a product publishes itself: a signed image, and a signed release.json and compose
# file on the release. Before the release is published the new updater updates to that example with nothing replaced
# (updater/test/real.sh), and once it is out a second job does the same from GitHub. If the image job fails, re-run
# the failed job and it finishes the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/escalay/updater
  EXAMPLE: ghcr.io/escalay/updater-example

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release commit, its tag and the draft release
      pull-requests: write # the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # publishing the release
      packages: write # the image on GHCR
      id-token: write # the identity cosign and the attestation sign with
      attestations: write # build provenance stored by GitHub
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The updater, end to end
        run: updater/test/run.sh
      - name: Its cosign reads real signatures
        run: updater/test/signatures.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Updater
            org.opencontainers.image.description=Carries out the updates a self-hosted app asks for, and rolls back the ones that fail.
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image, and check the signature the way a running updater does
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # The example app, published as a product would publish itself
      - id: example
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: example/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.EXAMPLE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The example app the updater's releases are proven against.
            org.opencontainers.image.licenses=MIT
      - name: Sign the example, and write its release files
        env:
          DIGEST: ${{ steps.example.outputs.digest }}
        run: |
          cosign sign --yes "${EXAMPLE}@${DIGEST}"
          mkdir release
          cp example/docker-compose.yml release/docker-compose.yml
          jq -n --arg version "$VERSION" --arg image "${EXAMPLE}@${DIGEST}" \
            --arg from "$(jq -r .upgradeFrom example/release.json)" \
            --arg sha "$(sha256sum release/docker-compose.yml | cut -d' ' -f1)" \
            '{version: $version, upgradeFrom: $from, image: $image, compose: {file: "docker-compose.yml", sha256: $sha}}' \
            > release/release.json
      - id: files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Update to the example for real, with the updater just built
        env:
          BUNDLE: ${{ steps.files.outputs.bundle-path }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cp "$BUNDLE" release/selfhost-kit.intoto.jsonl
          chmod -R a+rX release
          UPDATER_UNDER_TEST="${IMAGE}@${DIGEST}" updater/test/real.sh "$VERSION" "$PWD/release"
      - name: Attach the example's files, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --latest

  # What anyone gets: the published updater, the published files, the published signatures
  published:
    needs: [release-please, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update to the published example, from GitHub
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: updater/test/real.sh "$VERSION"
