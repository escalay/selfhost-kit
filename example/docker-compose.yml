# The example: the smallest app that keeps the updater's contract, with the updater beside it. Each release of this
# repository publishes it, signed, exactly as a product would publish its own: updater/test/real.sh then updates to
# it with nothing replaced, which is the proof that the updater reads real signatures end to end.
name: updater-example
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/escalay/updater-example:1.0.1} # x-release-please-version
    volumes:
      - state:/state
    restart: unless-stopped
  updater:
    image: ghcr.io/escalay/updater:1.0.1 # x-release-please-version
    environment:
      UPDATER_REPO: escalay/selfhost-kit
      UPDATER_IMAGE: ghcr.io/escalay/updater-example
    volumes:
      - state:/state
      - .:/project
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  state:
