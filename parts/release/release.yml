# Releases of a self-hosted product, from escalay/selfhost-kit (part "release"). On main, release-please keeps a
# release pull request open from the Conventional Commits since the last release, and this workflow starts that pull
# request's checks. Merging it tags vX.Y.Z and drafts the GitHub Release. Every push to main also builds the image
# for amd64 and arm64: "edge" always, and on a release "X.Y.Z", "X.Y" and "latest". The image is scanned and run
# through scripts/smoke.sh before it is pushed, carries an SBOM and build provenance, and is signed with cosign.
# Each release gets a release.json naming its image by digest, its compose file by hash and the oldest version that
# can update to it in one step (deploy/release.json): the updater installs only what that file names, and its own
# two signature checks are run against the release here before it is published. The notes open with
# docs/releases/<version>.md when that file exists. The release is published last. Yours to edit.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: A published release (v1.2.3) whose files get their provenance again. Empty for a normal run.
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release commit, its tag and the draft release
      pull-requests: write # the release pull request
      actions: write # starting CI for that pull request, which a bot's push doesn't
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request the bot opens or updates starts no workflow, so its required checks are started here
      - name: Start the checks of the release pull request
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(echo "$PR" | jq -r .headBranchName)"

  image:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # the release's files, and publishing it
      packages: write # the image on GHCR
      id-token: write # the identity cosign and the attestation sign with
      attestations: write # build provenance stored by GitHub
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }},enable=${{ needs.release-please.outputs.created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }},enable=${{ needs.release-please.outputs.created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.created == 'true' }}

      # Scanned before anything is pushed: a critical, fixable finding stops the release
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: app:scan
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Run the scanned image through the self-hosting path
        run: scripts/smoke.sh
        env:
          APP_IMAGE: app:scan

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub stores attestations for public repositories on the free plan; cosign and the build's own provenance
      # cover the image before then
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image, and check the signature the way SECURITY.md tells people to
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # GitHub renames an asset that starts with a dot, so the example goes up as env.example. A release that is
      # already out is signed as it was published.
      - name: Gather the release's files
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ needs.release-please.outputs.created }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir release
          if [ "$CREATED" = "true" ]; then
            cp deploy/compose/docker-compose.yml release/docker-compose.yml
            cp deploy/compose/.env.example release/env.example
            jq -n --arg version "${TAG#v}" --arg image "${IMAGE}@${DIGEST}" \
              --arg from "$(jq -r .upgradeFrom deploy/release.json)" \
              --arg sha "$(sha256sum release/docker-compose.yml | cut -d' ' -f1)" \
              '{version: $version, upgradeFrom: $from, image: $image, compose: {file: "docker-compose.yml", sha256: $sha}}' \
              > release/release.json
          else
            gh release download "$TAG" --dir release --pattern docker-compose.yml --pattern env.example --pattern release.json
          fi
      - id: files
        if: ${{ env.TAG != '' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Attach the files and their provenance, then publish the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ needs.release-please.outputs.created }}
          BUNDLE: ${{ steps.files.outputs.bundle-path }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          provenance="${GITHUB_REPOSITORY##*/}.intoto.jsonl"
          if [ -n "$BUNDLE" ]; then
            cp "$BUNDLE" "$provenance"
            for file in release/*; do
              gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --bundle "$provenance" > /dev/null
            done
            # The two checks the updater makes before it installs a release, with its own cosign
            if [ "$CREATED" = "true" ]; then
              updater=$(sed -n 's/^ *image: \(ghcr.io\/escalay\/updater:.*\)$/\1/p' deploy/compose/docker-compose.yml)
              signer="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
              head -n 1 "$provenance" > bundle.json
              docker run --rm -v "$PWD:/work" -w /work --entrypoint cosign "$updater" verify-blob-attestation \
                --bundle bundle.json --new-bundle-format --type slsaprovenance1 --certificate-identity "$signer" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com release/release.json
              docker run --rm --entrypoint cosign "$updater" verify "${IMAGE}@${DIGEST}" \
                --certificate-identity "$signer" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            fi
            mv "$provenance" release/
          fi
          gh release upload "$TAG" release/* --clobber
          if [ "$CREATED" = "true" ]; then
            # What a person must know before the list of changes: docs/releases/<version>.md leads the notes
            lead="docs/releases/${TAG#v}.md"
            if [ -f "$lead" ]; then
              { cat "$lead"; echo; gh release view "$TAG" --json body --jq .body; } > notes.md
              gh release edit "$TAG" --notes-file notes.md
            fi
            gh release edit "$TAG" --draft=false --latest
          fi
